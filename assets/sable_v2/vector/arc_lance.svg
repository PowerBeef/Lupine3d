<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!--
    Sable Outpost arc lance, first person. Cel units; tools/draw_weapons.py
    reduces it. Two emitter prongs with a gap the arc jumps, a wide emitter
    head with its intakes, a housing carrying the capacitor ring that slides
    back after a discharge, and the grip block under the frame.
  -->
  <g id="gun">
    <!-- grip block under the housing -->
    <path d="M 8.8,26.8 L 23.2,26.8 L 23.2,32 L 8.8,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6"/>
    <path d="M 9.3,27.1 L 22.7,27.1 L 22.7,27.9 L 9.3,27.9 Z" fill="#eee5c5"/>
    <path d="M 10.0,29.2 L 22.0,29.2 L 22.0,29.8 L 10.0,29.8 Z" fill="#1e2328"/>

    <!-- housing: a boxy body, lit on the left, dark on the right -->
    <path d="M 9.8,16.2 L 22.2,16.2 L 22.2,26.8 L 9.8,26.8 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6"/>
    <path d="M 10.4,16.8 L 12.2,16.8 L 12.2,26.2 L 10.4,26.2 Z" fill="#eee5c5"/>
    <path d="M 20.6,16.8 L 21.6,16.8 L 21.6,26.2 L 20.6,26.2 Z" fill="#1e2328"/>
    <path d="M 12.8,23.6 L 19.4,23.6 L 19.4,24.2 L 12.8,24.2 Z" fill="#1e2328"/>

    <!-- capacitor ring: rides back along the housing after a discharge -->
    <g id="action" data-travel="3.0">
      <path d="M 8.4,18.2 Q 16,16.2 23.6,18.2 L 23.6,21.4 Q 16,23.2 8.4,21.4 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 9.1,18.8 Q 16,16.9 22.9,18.8 L 22.9,19.7 Q 16,17.8 9.1,19.7 Z" fill="#eee5c5"/>
      <path d="M 8.6,20.6 Q 16,22.3 23.4,20.6 L 23.4,21.4 Q 16,23.2 8.6,21.4 Z" fill="#1e2328"/>
    </g>

    <!-- emitter head: wide, bevelled, with two dark intakes -->
    <path d="M 9.0,12.0 L 23.0,12.0 L 22.4,16.4 L 9.6,16.4 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 9.6,12.4 L 22.4,12.4 L 22.3,13.3 L 9.7,13.3 Z" fill="#eee5c5"/>
    <path d="M 10.6,14.0 L 13.8,14.0 L 13.7,15.6 L 10.7,15.6 Z" fill="#1e2328"/>
    <path d="M 18.2,14.0 L 21.4,14.0 L 21.3,15.6 L 18.3,15.6 Z" fill="#1e2328"/>
    <path d="M 14.6,14.2 L 17.4,14.2 L 17.4,15.4 L 14.6,15.4 Z" fill="#eee5c5"/>

    <!-- prongs: tapered, lit on the left edge, dark caps -->
    <path d="M 11.4,12.2 L 13.9,12.2 L 15.1,1.0 L 13.9,1.0 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 18.1,12.2 L 20.6,12.2 L 18.1,1.0 L 16.9,1.0 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 11.9,12.0 L 12.9,12.0 L 14.4,1.6 L 14.05,1.6 Z" fill="#eee5c5"/>
    <path d="M 18.6,12.0 L 19.6,12.0 L 17.5,1.6 L 17.15,1.6 Z" fill="#eee5c5"/>
    <path d="M 13.8,2.2 L 15.2,2.2 L 15.1,0.8 L 13.9,0.8 Z" fill="#1e2328"/>
    <path d="M 16.8,2.2 L 18.2,2.2 L 18.1,0.8 L 16.9,0.8 Z" fill="#1e2328"/>

    <g id="hands">
      <path d="M 0,32 L 0,20.6 Q 0.6,18.4 3.6,18.2 Q 7.4,18.4 7.9,20.4 L 7.9,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 0.9,20.2 Q 3.4,18.9 7.0,20.4 L 7.0,21.8 Q 3.4,20.4 0.9,22.0 Z" fill="#eee5c5"/>
      <path d="M 0.5,24.2 Q 4,23.2 7.6,24.2 L 7.6,24.8 Q 4,23.8 0.5,24.8 Z" fill="#1e2328"/>
      <path d="M 1.1,25.3 Q 4,24.4 7.0,25.3 L 7.0,26.4 Q 4,25.5 1.1,26.4 Z" fill="#eee5c5"/>
      <path d="M 0,29.4 L 7.9,29.4 L 7.9,30.2 L 0,30.2 Z" fill="#1e2328"/>

      <path d="M 32,32 L 32,21.4 Q 31.4,19.2 28.4,19.0 Q 24.6,19.2 24.1,21.2 L 24.1,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 25.0,21.0 Q 28.4,19.7 31.1,21.2 L 31.1,22.6 Q 28.4,21.2 25.0,22.8 Z" fill="#eee5c5"/>
      <path d="M 24.4,25.0 Q 28,24.0 31.5,25.0 L 31.5,25.6 Q 28,24.6 24.4,25.6 Z" fill="#1e2328"/>
      <path d="M 25.0,26.1 Q 28,25.2 30.9,26.1 L 30.9,27.2 Q 28,26.3 25.0,27.2 Z" fill="#eee5c5"/>
      <path d="M 24.1,30.0 L 32,30.0 L 32,30.8 L 24.1,30.8 Z" fill="#1e2328"/>
    </g>

    <!-- the arc jumping the gap, kick cel only -->
    <g id="flare" display="none">
      <path d="M 14.6,9.4 L 16.4,7.6 L 15.2,6.4 L 17.2,4.6 L 15.8,3.6 L 17.4,1.8 L 16.6,4.0 L 17.8,5.0 L 16.0,6.8 L 17.2,7.8 Z" fill="#eee5c5"/>
    </g>
  </g>
</svg>
