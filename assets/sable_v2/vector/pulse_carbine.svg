<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!--
    Sable Outpost pulse carbine, first person. Cel units; tools/draw_weapons.py
    reduces it. Short and boxy: a stub barrel under a square hider, two stacked
    coil drums whose vent shutter slides open after a burst, a magazine well on
    the left of the receiver.
  -->
  <g id="gun">
    <!-- receiver with the magazine well on the left -->
    <path d="M 8.4,19.6 L 23.6,19.6 L 23.6,32 L 8.4,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6"/>
    <path d="M 8.9,19.9 L 23.1,19.9 L 23.1,20.7 L 8.9,20.7 Z" fill="#eee5c5"/>
    <path d="M 9.4,22.2 L 13.6,22.2 L 13.6,30.6 L 9.4,30.6 Z" fill="#1e2328"/>
    <path d="M 9.9,22.7 L 13.1,22.7 L 13.1,29.9 L 9.9,29.9 Z" fill="#6f8489"/>
    <path d="M 10.3,23.2 L 12.7,23.2 L 12.7,24.0 L 10.3,24.0 Z" fill="#eee5c5"/>
    <path d="M 15.6,23.0 L 22.4,23.0 L 22.4,23.6 L 15.6,23.6 Z" fill="#1e2328"/>
    <path d="M 15.6,26.0 L 22.4,26.0 L 22.4,26.6 L 15.6,26.6 Z" fill="#1e2328"/>

    <!-- lower coil drum -->
    <path d="M 9.0,14.6 Q 16,12.6 23.0,14.6 L 23.0,19.0 Q 16,20.4 9.0,19.0 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 9.7,15.2 Q 16,13.3 22.3,15.2 L 22.3,16.1 Q 16,14.2 9.7,16.1 Z" fill="#eee5c5"/>
    <path d="M 9.2,18.2 Q 16,19.6 22.8,18.2 L 22.8,19.0 Q 16,20.4 9.2,19.0 Z" fill="#1e2328"/>

    <!-- upper coil drum with its vent slots; the shutter over them is the action -->
    <path d="M 9.6,8.6 Q 16,6.8 22.4,8.6 L 22.4,13.6 Q 16,15.0 9.6,13.6 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 10.3,9.2 Q 16,7.5 21.7,9.2 L 21.7,10.0 Q 16,8.3 10.3,10.0 Z" fill="#eee5c5"/>
    <path d="M 10.6,11.0 L 13.4,11.0 L 13.4,13.0 L 10.6,13.0 Z" fill="#1e2328"/>
    <path d="M 14.6,11.0 L 17.4,11.0 L 17.4,13.0 L 14.6,13.0 Z" fill="#1e2328"/>
    <path d="M 18.6,11.0 L 21.4,11.0 L 21.4,13.0 L 18.6,13.0 Z" fill="#1e2328"/>
    <g id="action" data-travel="1.6">
      <path d="M 10.2,10.6 L 21.8,10.6 L 21.8,12.4 L 10.2,12.4 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.4"/>
      <path d="M 10.6,10.9 L 21.4,10.9 L 21.4,11.4 L 10.6,11.4 Z" fill="#eee5c5"/>
    </g>

    <!-- stub barrel, square hider, front post -->
    <path d="M 14.4,8.8 L 17.6,8.8 L 17.1,4.0 L 14.9,4.0 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 14.9,8.6 L 16.0,8.6 L 15.9,4.4 L 15.2,4.4 Z" fill="#eee5c5"/>
    <path d="M 14.4,4.6 L 17.6,4.6 L 17.6,2.6 L 14.4,2.6 Z" fill="#1e2328"/>
    <path d="M 14.9,4.2 L 17.1,4.2 L 17.1,3.2 L 14.9,3.2 Z" fill="#6f8489"/>
    <path d="M 15.55,2.8 L 16.45,2.8 L 16.45,1.6 L 15.55,1.6 Z" fill="#eee5c5" stroke="#1e2328" stroke-width="0.3"/>

    <g id="hands">
      <path d="M 0,32 L 0,20.6 Q 0.6,18.4 3.6,18.2 Q 7.4,18.4 7.9,20.4 L 7.9,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 0.9,20.2 Q 3.4,18.9 7.0,20.4 L 7.0,21.8 Q 3.4,20.4 0.9,22.0 Z" fill="#eee5c5"/>
      <path d="M 0.5,24.2 Q 4,23.2 7.6,24.2 L 7.6,24.8 Q 4,23.8 0.5,24.8 Z" fill="#1e2328"/>
      <path d="M 1.1,25.3 Q 4,24.4 7.0,25.3 L 7.0,26.4 Q 4,25.5 1.1,26.4 Z" fill="#eee5c5"/>
      <path d="M 0,29.4 L 7.9,29.4 L 7.9,30.2 L 0,30.2 Z" fill="#1e2328"/>

      <path d="M 32,32 L 32,21.4 Q 31.4,19.2 28.4,19.0 Q 24.6,19.2 24.1,21.2 L 24.1,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 25.0,21.0 Q 28.4,19.7 31.1,21.2 L 31.1,22.6 Q 28.4,21.2 25.0,22.8 Z" fill="#eee5c5"/>
      <path d="M 24.4,25.0 Q 28,24.0 31.5,25.0 L 31.5,25.6 Q 28,24.6 24.4,25.6 Z" fill="#1e2328"/>
      <path d="M 25.0,26.1 Q 28,25.2 30.9,26.1 L 30.9,27.2 Q 28,26.3 25.0,27.2 Z" fill="#eee5c5"/>
      <path d="M 24.1,30.0 L 32,30.0 L 32,30.8 L 24.1,30.8 Z" fill="#1e2328"/>
    </g>

    <g id="flare" display="none">
      <path d="M 13.8,3.0 L 16,-1.0 L 18.2,3.0 L 16,1.6 Z" fill="#eee5c5"/>
    </g>
  </g>
</svg>
