<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!--
    Sable Outpost shotgun, first person. Drawn in cel units (one unit is one
    pixel of the 32x32 cel); tools/draw_weapons.py rasterises this at 16x and
    reduces it. Tones: dark #1e2328, mid #6f8489, light #eee5c5. The eye is
    above and behind the gun: the twin bores run from the forend at the bottom
    of the frame to the muzzle at the top, converging on the reticle thirty
    units above the frame. The receiver sits under the forend, mostly out of
    frame; the gloves live in the bottom corner objects, which the console
    draws in leather.
  -->
  <g id="gun">
    <!-- receiver: under the forend, its top bevel catching the light -->
    <path d="M 8.4,27.0 L 23.6,27.0 L 23.6,32 L 8.4,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6"/>
    <path d="M 8.9,27.3 L 23.1,27.3 L 23.1,28.1 L 8.9,28.1 Z" fill="#eee5c5"/>
    <path d="M 17.6,28.7 L 22.4,28.7 L 22.4,31.1 L 17.6,31.1 Z" fill="#1e2328"/>
    <path d="M 18.0,29.0 L 21.9,29.0 L 21.9,29.6 L 18.0,29.6 Z" fill="#6f8489"/>
    <path d="M 9.2,29.4 L 15.8,29.4 L 15.8,30.0 L 9.2,30.0 Z" fill="#1e2328"/>

    <!-- magazine tube: the mid strip that runs under the bores to the clamp -->
    <path d="M 14.4,17.6 L 17.6,17.6 L 16.7,6.0 L 15.3,6.0 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.4"/>
    <path d="M 15.1,6.6 L 16.9,6.6 L 16.75,5.2 L 15.25,5.2 Z" fill="#1e2328"/>

    <!-- twin bores: lit tops, shaded right flanks, a dark valley between -->
    <path d="M 11.5,17.4 L 15.7,17.4 L 15.85,1.4 L 14.25,1.4 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 16.3,17.4 L 20.5,17.4 L 17.75,1.4 L 16.15,1.4 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 12.2,17.2 L 14.5,17.2 L 15.25,2.0 L 14.55,2.0 Z" fill="#eee5c5"/>
    <path d="M 16.9,17.2 L 18.6,17.2 L 17.05,2.0 L 16.45,2.0 Z" fill="#eee5c5"/>
    <path d="M 19.4,17.2 L 20.3,17.2 L 17.7,2.0 L 17.4,2.0 Z" fill="#1e2328"/>
    <path d="M 15.55,17.6 L 16.45,17.6 L 16.15,1.6 L 15.85,1.6 Z" fill="#1e2328"/>
    <!-- crowns at the muzzle, the bead above the valley -->
    <path d="M 14.1,2.6 L 17.9,2.6 L 17.8,1.0 L 14.2,1.0 Z" fill="#1e2328"/>
    <path d="M 15.5,1.9 L 16.5,1.9 L 16.5,0.7 L 15.5,0.7 Z" fill="#eee5c5" stroke="#1e2328" stroke-width="0.3"/>
    <!-- the bores cast a shadow onto the forend where they meet it -->
    <path d="M 11.0,17.4 Q 16,19.9 21.0,17.4 Z" fill="#1e2328"/>

    <!-- the pump forend: a rounded, grooved sleeve, nearest thing in view -->
    <g id="action" data-travel="2.4">
      <path d="M 6.3,19.8 Q 16,16.4 25.7,19.8 L 25.7,26.2 Q 16,28.2 6.3,26.2 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <!-- lit crown of the sleeve, strongest on the left where the light is -->
      <path d="M 7.0,20.5 Q 16,17.2 25.0,20.5 L 25.0,21.4 Q 16,18.2 7.0,21.4 Z" fill="#eee5c5"/>
      <path d="M 7.0,20.7 Q 12.5,18.4 15.5,18.4 L 15.5,20.2 Q 12.5,20.2 7.0,22.2 Z" fill="#eee5c5"/>
      <!-- two grip grooves following the curve -->
      <path d="M 6.8,22.9 Q 16,20.2 25.2,22.9 L 25.2,23.4 Q 16,20.7 6.8,23.4 Z" fill="#1e2328"/>
      <path d="M 6.8,24.7 Q 16,22.2 25.2,24.7 L 25.2,25.2 Q 16,22.7 6.8,25.2 Z" fill="#1e2328"/>
      <!-- the underside in shadow -->
      <path d="M 6.3,25.7 Q 16,27.5 25.7,25.7 L 25.7,26.2 Q 16,28.2 6.3,26.2 Z" fill="#1e2328"/>
    </g>

    <!-- gloves: support hand cupping the forend on the left, trigger hand's knuckles on the right -->
    <g id="hands">
      <path d="M 0,32 L 0,20.6 Q 0.6,18.4 3.6,18.2 Q 7.4,18.4 7.9,20.4 L 7.9,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <!-- knuckle highlight, one crease between the fingers, the cuff -->
      <path d="M 0.9,20.2 Q 3.4,18.9 7.0,20.4 L 7.0,21.8 Q 3.4,20.4 0.9,22.0 Z" fill="#eee5c5"/>
      <path d="M 0.5,24.2 Q 4,23.2 7.6,24.2 L 7.6,24.8 Q 4,23.8 0.5,24.8 Z" fill="#1e2328"/>
      <path d="M 1.1,25.3 Q 4,24.4 7.0,25.3 L 7.0,26.4 Q 4,25.5 1.1,26.4 Z" fill="#eee5c5"/>
      <path d="M 0,29.4 L 7.9,29.4 L 7.9,30.2 L 0,30.2 Z" fill="#1e2328"/>

      <path d="M 32,32 L 32,21.4 Q 31.4,19.2 28.4,19.0 Q 24.6,19.2 24.1,21.2 L 24.1,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 25.0,21.0 Q 28.4,19.7 31.1,21.2 L 31.1,22.6 Q 28.4,21.2 25.0,22.8 Z" fill="#eee5c5"/>
      <path d="M 24.4,25.0 Q 28,24.0 31.5,25.0 L 31.5,25.6 Q 28,24.6 24.4,25.6 Z" fill="#1e2328"/>
      <path d="M 25.0,26.1 Q 28,25.2 30.9,26.1 L 30.9,27.2 Q 28,26.3 25.0,27.2 Z" fill="#eee5c5"/>
      <path d="M 24.1,30.0 L 32,30.0 L 32,30.8 L 24.1,30.8 Z" fill="#1e2328"/>
    </g>

    <!-- the discharge, kick cel only -->
    <g id="flare" display="none">
      <path d="M 13.6,1.8 L 16,-1.6 L 18.4,1.8 L 16,0.6 Z" fill="#eee5c5"/>
    </g>
  </g>
</svg>
