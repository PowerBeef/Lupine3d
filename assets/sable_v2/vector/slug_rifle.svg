<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!--
    Sable Outpost slug rifle, first person. Cel units; tools/draw_weapons.py
    reduces it. One heavy bore under a vented brake, a slim rounded forend,
    a flat receiver with a rail slot, and the charging handle on the left of
    the forend that rides back on the cycle.
  -->
  <g id="gun">
    <!-- receiver: flat top with a lit bevel and a rail slot down the middle -->
    <path d="M 8.4,24.6 L 23.6,24.6 L 23.6,32 L 8.4,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6"/>
    <path d="M 8.9,24.9 L 23.1,24.9 L 23.1,25.7 L 8.9,25.7 Z" fill="#eee5c5"/>
    <path d="M 14.9,26.3 L 17.1,26.3 L 17.1,31.2 L 14.9,31.2 Z" fill="#1e2328"/>
    <path d="M 15.4,26.7 L 16.6,26.7 L 16.6,30.8 L 15.4,30.8 Z" fill="#6f8489"/>
    <path d="M 18.4,27.2 L 22.6,27.2 L 22.6,29.4 L 18.4,29.4 Z" fill="#1e2328"/>
    <path d="M 18.8,27.5 L 22.2,27.5 L 22.2,28.1 L 18.8,28.1 Z" fill="#6f8489"/>

    <!-- the bore: a lit left face, mid body, dark right flank -->
    <path d="M 12.4,17.6 L 19.6,17.6 L 17.2,1.2 L 14.8,1.2 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 13.3,17.4 L 16.2,17.4 L 16.0,1.8 L 15.0,1.8 Z" fill="#eee5c5"/>
    <path d="M 18.2,17.4 L 19.3,17.4 L 17.0,1.8 L 16.6,1.8 Z" fill="#1e2328"/>
    <!-- vented brake: three slots cut across the bore, the crown, the post -->
    <path d="M 14.3,7.2 L 17.8,7.2 L 17.7,6.4 L 14.4,6.4 Z" fill="#1e2328"/>
    <path d="M 14.5,5.6 L 17.6,5.6 L 17.5,4.8 L 14.6,4.8 Z" fill="#1e2328"/>
    <path d="M 14.65,4.0 L 17.45,4.0 L 17.35,3.2 L 14.75,3.2 Z" fill="#1e2328"/>
    <path d="M 14.6,2.4 L 17.4,2.4 L 17.3,0.8 L 14.7,0.8 Z" fill="#1e2328"/>
    <path d="M 15.55,1.6 L 16.45,1.6 L 16.45,0.4 L 15.55,0.4 Z" fill="#eee5c5" stroke="#1e2328" stroke-width="0.3"/>
    <!-- the bore's shadow on the forend -->
    <path d="M 12.0,17.6 Q 16,19.6 20.0,17.6 Z" fill="#1e2328"/>

    <!-- slim forend: rounded, one groove, lit along the top -->
    <path d="M 9.2,19.4 Q 16,16.9 22.8,19.4 L 22.8,23.6 Q 16,25.2 9.2,23.6 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 9.9,20.0 Q 16,17.7 22.1,20.0 L 22.1,20.9 Q 16,18.6 9.9,20.9 Z" fill="#eee5c5"/>
    <path d="M 9.5,22.0 Q 16,20.0 22.5,22.0 L 22.5,22.5 Q 16,20.5 9.5,22.5 Z" fill="#1e2328"/>
    <path d="M 9.2,23.0 Q 16,24.6 22.8,23.0 L 22.8,23.6 Q 16,25.2 9.2,23.6 Z" fill="#1e2328"/>

    <!-- charging handle on the left, rides back (down the frame) on the cycle -->
    <g id="action" data-travel="2.6">
      <path d="M 9.0,19.4 L 12.6,19.4 L 12.6,21.4 L 9.0,21.4 Z" fill="#eee5c5" stroke="#1e2328" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M 9.3,20.6 L 12.3,20.6 L 12.3,21.1 L 9.3,21.1 Z" fill="#6f8489"/>
    </g>

    <g id="hands">
      <path d="M 0,32 L 0,20.6 Q 0.6,18.4 3.6,18.2 Q 7.4,18.4 7.9,20.4 L 7.9,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 0.9,20.2 Q 3.4,18.9 7.0,20.4 L 7.0,21.8 Q 3.4,20.4 0.9,22.0 Z" fill="#eee5c5"/>
      <path d="M 0.5,24.2 Q 4,23.2 7.6,24.2 L 7.6,24.8 Q 4,23.8 0.5,24.8 Z" fill="#1e2328"/>
      <path d="M 1.1,25.3 Q 4,24.4 7.0,25.3 L 7.0,26.4 Q 4,25.5 1.1,26.4 Z" fill="#eee5c5"/>
      <path d="M 0,29.4 L 7.9,29.4 L 7.9,30.2 L 0,30.2 Z" fill="#1e2328"/>

      <path d="M 32,32 L 32,21.4 Q 31.4,19.2 28.4,19.0 Q 24.6,19.2 24.1,21.2 L 24.1,32 Z" fill="#6f8489" stroke="#1e2328" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 25.0,21.0 Q 28.4,19.7 31.1,21.2 L 31.1,22.6 Q 28.4,21.2 25.0,22.8 Z" fill="#eee5c5"/>
      <path d="M 24.4,25.0 Q 28,24.0 31.5,25.0 L 31.5,25.6 Q 28,24.6 24.4,25.6 Z" fill="#1e2328"/>
      <path d="M 25.0,26.1 Q 28,25.2 30.9,26.1 L 30.9,27.2 Q 28,26.3 25.0,27.2 Z" fill="#eee5c5"/>
      <path d="M 24.1,30.0 L 32,30.0 L 32,30.8 L 24.1,30.8 Z" fill="#1e2328"/>
    </g>

    <g id="flare" display="none">
      <path d="M 13.8,1.6 L 16,-1.8 L 18.2,1.6 L 16,0.4 Z" fill="#eee5c5"/>
    </g>
  </g>
</svg>
