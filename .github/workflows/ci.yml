name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sustained:
        description: Run 60-second rendering comparisons against the review baseline
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sustained:
    if: github.event_name == 'workflow_dispatch' && inputs.sustained
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Check out immutable review source
        uses: actions/checkout@v4
        with:
          # v0.8, the last tagged release. The previous pin predated the
          # v0.8 display change, so the current host oracle could not
          # validate that ROM - not at this commit and not at the v0.8
          # tag either.
          ref: fc0fa4b5ea81f091c662c4d73dbeed97cbb951cd
          path: .render-baselines/source
      - name: Preserve baseline ROM and symbols
        run: |
          python .render-baselines/source/tools/build_rom.py
          python tools/archive_baseline.py --source .render-baselines/source/build --output .render-baselines/baseline
      - run: make build
      - name: Compare sustained controller replays
        run: make sustained MOTION_ARGS="--baseline-rom .render-baselines/baseline/lupine3d.gb --baseline-symbols .render-baselines/baseline/lupine3d.sym"
      - name: Complete and restart with controller input
        run: |
          python tools/playthrough.py --restart --output-dir build/sustained/completion
          python tools/playthrough.py --restart --rom .render-baselines/baseline/lupine3d.gb --symbols .render-baselines/baseline/lupine3d.sym --output-dir build/sustained/baseline-completion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sustained-rendering-${{ github.sha }}
          path: |
            build/sustained/
            build/build_manifest.json
            build/lupine3d.gb
            .render-baselines/baseline/archive.json

  # The fast lane: the regression suite, the driven routes and the golden-image
  # snapshots. Its artifact is the visual diff a reviewer opens when a
  # snapshot changed (build/snapshots/**/report.html).
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and run regression suite
        run: make test

      - name: Check the documentation (links, commands, generated memory map)
        run: make docs-check

      - name: Run driven playtests against the golden snapshots
        run: make playtest playtest-world playtest-art

      - name: Summarise snapshot suites
        if: always()
        run: python tools/snapshot.py diff --suite tour --suite world --suite art --suite sable || true

      - name: Upload the visual diff
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diff-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/snapshots/
            build/playtest/coherence_tour/report.json
            build/playtest/coherence_tour/contact_sheet.png
            build/playtest/living_world/report.json
            build/playtest/living_world/contact_sheet.png
            build/playtest/sable_art_tour/report.json
            build/playtest/sable_art_tour/contact_sheet.png

      - name: Upload ROM and manifest
        uses: actions/upload-artifact@v4
        with:
          name: lupine3d-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/lupine3d.gb
            build/lupine3d.sym
            build/build_manifest.json

  # The campaign lanes: episodes two and three played by the controller route
  # from their continue codes in three-sector chunks, in parallel with the
  # slow lane, which plays episode one. The last chunk restarts the campaign
  # from the ending. release_check.py unions every report.
  campaign:
    runs-on: ubuntu-latest
    # A chunk is at most 10,500 route updates (three sectors of 3,500); the
    # heaviest measured chunk, 16-18 with the restart, is 7,500.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - episode: 2a
            sectors: 7-9
            restart: ""
          - episode: 2b
            sectors: 10-12
            restart: ""
          - episode: 3a
            sectors: 13-15
            restart: ""
          - episode: 3b
            sectors: 16-18
            restart: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build
        run: make build

      - name: Complete episode ${{ matrix.episode }} with controller input only
        run: make playthrough SECTORS=${{ matrix.sectors }} RESTART=${{ matrix.restart }} ROUTE_DIR=build/playthrough-ep${{ matrix.episode }}

      - name: Upload the route evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-ep${{ matrix.episode }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/playthrough-ep${{ matrix.episode }}/report.json
            build/playthrough-ep${{ matrix.episode }}/contact_sheet.png

  # The slow lane: the controller route, the exact A/B variants, wall reuse,
  # LCD-timed motion, and the pinned independent cores over the frozen
  # witness scenes. Both cores are cached by their pinned commit.
  # The retained slim alternatives: flat walls (with their own goldens) and
  # the synchronous publication tail the default overlaps.
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the flat slim profile and verify it against its goldens and the Sable checks
        run: make playtest-flat sable-check-flat

      - name: Summarise the flat profile's snapshot suites
        if: always()
        run: make snapshot-diff-flat || true

      - name: Verify the synchronous publication tail on the tour and a motion replay
        run: make playtest-sync

      - name: Upload the flat profile's visual diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-flat-${{ github.sha }}
          path: build/snapshots/slim-sable-v2
          if-no-files-found: ignore

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build
        run: make build

      - name: Complete episode one with controller input only
        run: make playthrough SECTORS=1-6

      - name: Verify two-actor, folding and reprojection variants
        run: make variants

      - name: Verify exact wall reuse and timed combat feedback
        run: make wall-reuse

      - name: Verify LCD-timed walking, turning and door animation
        run: make motion

      - name: Restore the pinned emulator cores
        id: cores
        uses: actions/cache@v4
        with:
          path: build/deps
          key: cores-sameboy-213a12ce93d66b105a113debd9396306066a7cfc-mgba-507061afd70489a0c2ffc8ba26d8f9b53d6cf7d6-v1

      - name: Check out pinned independent emulator
        if: steps.cores.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: LIJI32/SameBoy
          ref: 213a12ce93d66b105a113debd9396306066a7cfc
          path: build/deps/SameBoy

      - name: Build SameBoy's core library
        if: steps.cores.outputs.cache-hit != 'true'
        run: make -C build/deps/SameBoy lib -j2 CONF=release DISABLE_DEBUGGER=1 DISABLE_CHEATS=1 DISABLE_REWIND=1

      - name: Check out pinned mGBA core
        if: steps.cores.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: 507061afd70489a0c2ffc8ba26d8f9b53d6cf7d6
          path: build/deps/mgba

      - name: Build mGBA's core library
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          cmake -S build/deps/mgba -B build/deps/mgba/build -DLIBMGBA_ONLY=ON -DBUILD_STATIC=ON -DBUILD_SHARED=OFF -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_LIBZIP=OFF -DUSE_SQLITE3=OFF -DUSE_LZMA=OFF -DUSE_PNG=OFF -DUSE_ELF=OFF -DUSE_EDITLINE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/deps/mgba/build -j2

      - name: Verify CPU and PPU in SameBoy CGB-0 and CGB-E
        run: make sameboy SAMEBOY_DIR=build/deps/SameBoy

      - name: Compare the host harness's CPU model with SameBoy over every emitted instruction form
        run: make conformance SAMEBOY_DIR=build/deps/SameBoy

      - name: Verify CPU and PPU in mGBA
        run: make mgba MGBA_DIR=build/deps/mgba

      - name: Compare frozen art and geometry in all pinned cores and against the witness goldens
        run: python tools/independent_witnesses.py

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/lupine3d.gb
            build/build_manifest.json
            build/playthrough/report.json
            build/playthrough/contact_sheet.png
            build/snapshots/
            build/sameboy_*.json
            build/sameboy_*.ppm
            build/mgba_*.json
            build/mgba_*.png
            build/two_sentinels.*
            build/reprojection.json
            build/*folded_pixels.json
            build/reuse_disabled_pixels.json
            build/wall_reuse.json
            build/motion_benchmark.json
            build/prepared_disabled_pixels.json
            build/independent-witnesses/report.json
            build/conformance/report.json
