name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and run regression suite
        run: make test

      - name: Run driven playtest and pixel oracle
        run: make playtest playtest-world

      - name: Upload ROM and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: lupine3d-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/lupine3d.gb
            build/build_manifest.json
            build/playtest/coherence_tour/report.json
            build/playtest/coherence_tour/contact_sheet.png
            build/playtest/living_world/report.json
            build/playtest/living_world/contact_sheet.png
