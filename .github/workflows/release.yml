name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify tag matches VERSION
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"

      - name: Regenerate both exact VRAM-profile atlases
        run: make research-atlas-all

      - name: Build, verify, and clean-room package
        run: python tools/package_release.py --output-dir dist --regenerate-previews

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Lupine3D_v*_* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Lupine3D_v*_* \
              --verify-tag \
              --generate-notes \
              --title "Lupine 3D $GITHUB_REF_NAME"
          fi
