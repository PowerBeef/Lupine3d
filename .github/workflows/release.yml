name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify tag matches VERSION
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Regenerate both exact VRAM-profile atlases
        run: make research-atlas-all

      - name: Build, verify, and clean-room package
        run: python tools/package_release.py --output-dir dist --regenerate-previews

      - name: Retain CI release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; preserving its uploaded qualification evidence."
          else
            python - <<'PY'
          import os
          from pathlib import Path
          notes = Path("RELEASE_NOTES.md").read_text().split("\n---\n", 1)[0].strip()
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['GITHUB_REF_NAME']}/"
          Path("build/current_release_notes.md").write_text(notes.replace("(docs/", "(" + base + "docs/") + "\n")
          PY
            release_args=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_args+=(--prerelease); fi
            asset_base="dist/Lupine3D_${GITHUB_REF_NAME}"
            gh release create "$GITHUB_REF_NAME" \
              "${asset_base}.gb" "${asset_base}"_* \
              --verify-tag \
              --notes-file build/current_release_notes.md \
              --title "Lupine 3D $GITHUB_REF_NAME" \
              "${release_args[@]}"
          fi
