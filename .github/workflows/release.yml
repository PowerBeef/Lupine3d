name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching VERSION (for example, v0.9)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    # A normal push must never publish. A main-branch release request must
    # have the exact subject "release: v<VERSION>", checked again below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release: v'))
    runs-on: ubuntu-latest
    # The packager plays the whole eighteen-sector route on one runner (CI
    # spreads it over eight), then builds, extracts and tests the archive
    # twice: hours, not the one v0.9's five sectors fitted in.
    timeout-minutes: 330
    concurrency:
      group: lupine3d-release
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify release target
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          expected_tag="v$(cat VERSION)"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:tag)
              release_tag="$GITHUB_REF_NAME"
              ;;
            workflow_dispatch:*)
              release_tag="$REQUESTED_TAG"
              ;;
            push:branch)
              subject="$(git log -1 --format=%s)"
              test "$subject" = "release: $expected_tag"
              release_tag="$expected_tag"
              ;;
            *)
              echo "Unsupported release trigger" >&2
              exit 1
              ;;
          esac
          test "$release_tag" = "$expected_tag"
          git check-ref-format "refs/tags/$release_tag"
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$release_sha" origin/main
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            test "$(git rev-parse "refs/tags/${release_tag}^{commit}")" = "$release_sha"
          fi
          printf '%s\n' "RELEASE_TAG=$release_tag" "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate the qualified atlas assets without retraining
        run: make atlas-check

      - name: Build, verify, and clean-room package
        # Full short gates and extracted-source tests run here. The packager
        # also requires hash-bound sustained/pinned-core evidence retained in
        # milestones/v<VERSION>; a different ROM cannot reuse it.
        run: python tools/package_release.py --output-dir dist --regenerate-previews

      - name: Retain CI release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

      - name: Ensure the verified release tag exists
        # GITHUB_TOKEN tag pushes do not start another workflow. This same
        # run therefore publishes the already-verified package below.
        run: |
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$remote_tag" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          else
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              git tag "$RELEASE_TAG" "$RELEASE_SHA"
            fi
            test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its uploaded qualification evidence."
          else
            python - <<'PY'
          import os
          from pathlib import Path
          notes = Path("RELEASE_NOTES.md").read_text().split("\n---\n", 1)[0].strip()
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['RELEASE_TAG']}/"
          Path("build/current_release_notes.md").write_text(notes.replace("(docs/", "(" + base + "docs/") + "\n")
          PY
            release_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then release_args+=(--prerelease); fi
            # The release is the showcase game's, named as the packager named
            # its assets: the game's title, built with the Lupine 3D engine.
            game_title="$(python -c 'import sys; sys.path.insert(0, "tools"); import package_release as p; print(p.GAME_TITLE)')"
            asset_slug="$(python -c 'import sys; sys.path.insert(0, "tools"); import package_release as p; print(p.PROJECT_SLUG)')"
            asset_base="dist/${asset_slug}_${RELEASE_TAG}"
            gh release create "$RELEASE_TAG" \
              "${asset_base}.gb" "${asset_base}"_* \
              --verify-tag \
              --notes-file build/current_release_notes.md \
              --title "$game_title $RELEASE_TAG" \
              "${release_args[@]}"
          fi
